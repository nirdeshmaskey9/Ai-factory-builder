<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or 'JoJo Planet' }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/img/favicon.svg" />
  <link rel="stylesheet" href="/static/css/neo.css" />
  <style>
    body { background: #0b0d16; color: #f8f8f8; }
    .accent { color: #f5c86d; }
    .accent-bg { background: #f5c86d; color: #0b0d16; }
    .card { background: #101323; border: 1px solid #1b2038; border-radius: 8px; }
    .pulse { animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
  </style>
</head>
<body class="min-h-screen">
  <!-- JP_HEADER_START -->
  <header class="jp-header">
    <div class="jp-left">
      <img src="/static/img/jojo-pup.svg" alt="JoJo" class="jp-logo" />
      <div class="jp-title">JoJo Planet</div>
      <div id="jp-memory-dot" class="jp-dot" title="Memory pulse"></div>
    </div>
    <div class="jp-center">
      <div class="jp-persona">
        <button data-persona="empath" class="jp-pill">Empath</button>
        <button data-persona="strategist" class="jp-pill">Strategist</button>
        <button data-persona="builder" class="jp-pill">Builder</button>
        <button data-persona="analyst" class="jp-pill">Analyst</button>
      </div>
    </div>
    <div class="jp-right">
      <button id="jp-theme" class="jp-icon" title="Toggle theme" onclick="jpThemeToggle()">🌓</button>
      <div id="jp-usage" class="jp-usage">Usage: <span id="jp-usage-tokens">0</span> tokens ≈ $<span id="jp-usage-usd">0.0000</span></div>
    </div>
  </header>
  <!-- JP_HEADER_END -->
  <header class="p-4 border-b border-slate-800">
    <h1 class="text-xl font-semibold">
      <span class="accent">JoJo Planet</span> v3.4.0 — First Contact
      <span class="ml-2 text-green-400">Online ✓ Hybrid Mode</span>
    </h1>
  </header>
  <main class="p-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="p-4 text-sm text-slate-400">
    © JoJo Planet
    <div id="controlPanel" class="mt-2 p-2 border-t border-slate-800 text-sm">
      <span>Mock Mode: <b id="mockModeStatus">loading...</b></span>
      <button onclick="toggleMock()" class="ml-3 px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded">Toggle</button>
      <span class="ml-6">Usage: <span id="usageStats">0 tokens ≈ $0.0000</span></span>
    </div>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/persona.js"></script>
    <script src="/static/js/commands.js"></script>
    <script src="/static/js/profile.js"></script>
    <script src="/static/js/memory_peek.js"></script>
    <script src="/static/js/voice.js"></script>
    <script src="/static/js/chat_hooks.js"></script>
    <script src="/static/js/system_status.js"></script>
  </footer>
</body>
</html>
