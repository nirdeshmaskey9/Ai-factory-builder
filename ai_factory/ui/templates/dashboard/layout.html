<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Factory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <nav class="bg-gray-900 text-white">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-12">
          <div class="flex items-center space-x-6">
            <a href="/dashboard" class="hover:text-teal-300">Home</a>
            <a href="/dashboard/runs" class="hover:text-teal-300">Runs</a>
            <a href="/factory/info" class="hover:text-teal-300">Info</a>
          </div>
          <div class="text-sm opacity-80">AI Factory</div>
        </div>
      </div>
    </nav>
    <main class="max-w-6xl mx-auto p-4">
      {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-xs text-gray-500 py-6">AI Factory Dashboard v1</footer>
  </body>
  </html>
