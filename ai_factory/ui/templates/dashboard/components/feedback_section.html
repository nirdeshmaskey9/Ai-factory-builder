<div class="bg-gray-900 rounded p-4">
  <h3 class="text-lg font-bold mb-2">Feedback</h3>
  <div class="flex items-center gap-2 mb-2">
    <button class="bg-green-600 px-3 py-1 rounded" onclick="window.Feedback && Feedback.vote({{ run_id }}, 'up')">👍</button>
    <button class="bg-red-600 px-3 py-1 rounded" onclick="window.Feedback && Feedback.vote({{ run_id }}, 'down')">👎</button>
  </div>
  <textarea id="fb-comment" class="w-full bg-gray-800 p-2 rounded" placeholder="optional comment..."></textarea>
  <button class="mt-2 bg-indigo-600 px-3 py-1 rounded" onclick="window.Feedback && Feedback.submit({{ run_id }})">Submit</button>
  <div id="fb-status" class="text-sm mt-2 opacity-80"></div>
</div>
