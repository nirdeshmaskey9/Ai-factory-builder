<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Mood Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container">
      <h1>Daily Mood Tracker</h1>
      <form action="/log" method="post" class="card">
        <label for="mood">Today's Mood (1–5)</label>
        <input type="number" id="mood" name="mood" min="1" max="5" required>
        <label for="note">Reflection (optional)</label>
        <textarea id="note" name="note" rows="3" placeholder="How are you feeling today?"></textarea>
        <button type="submit">Save</button>
      </form>
      <nav>
        <a href="/history">History</a>
        <a href="/summary">7‑Day Summary</a>
      </nav>
    </div>
  </body>
  </html>
