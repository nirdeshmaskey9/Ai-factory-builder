{% extends "base.html" %}
{% block content %}
<h1>History</h1>
<table>
  <thead><tr><th>date</th><th>mood</th><th>note</th></tr></thead>
  <tbody>
    {% for r in rows %}<tr><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ r[3] }}</td></tr>{% else %}<tr><td colspan='3'>No entries</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
