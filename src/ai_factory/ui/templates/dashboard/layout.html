<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Factory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-950 text-gray-100">
    <nav class="bg-gray-900 text-white">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-12">
          <div class="flex items-center space-x-6">
            <a href="/dashboard" class="hover:text-teal-300">Home</a>
            <a href="/dashboard/runs" class="hover:text-teal-300">Runs</a>
            <a href="/dashboard/analytics" class="hover:text-teal-300">Analytics</a>
            <a href="/factory/info" class="hover:text-teal-300">Info</a>
          </div>
          <div class="text-sm opacity-80 flex items-center space-x-2">
            <span id="ws-indicator" class="inline-block w-2 h-2 rounded-full bg-red-400"></span>
            <span>AI Factory</span>
          </div>
        </div>
      </div>
    </nav>
    <!-- JP_STATE_BAR_START -->
    <div id="jp-statebar" class="jp-statebar max-w-6xl mx-auto px-4">
      <span class="pill">JoJo — Unified Identity</span>
      <span class="pill" id="jp-pin">Pins: —</span>
      <span class="pill" id="jp-last">Last reflection: —</span>
    </div>
    <!-- JP_STATE_BAR_END -->
    <main class="max-w-6xl mx-auto p-4">
      {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-xs text-gray-500 py-6">AI Factory Control Center</footer>
    {% include "dashboard/components/toast.html" %}
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <script src="/static/js/ws.js"></script>
    <script src="/static/js/feedback.js"></script>
    <script src="/static/js/ui_helpers.js"></script>
    <script src="/static/js/analytics.js"></script>
    <script src="/static/js/progress.js"></script>
  </body>
  </html>
