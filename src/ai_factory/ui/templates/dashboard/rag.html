{% extends "dashboard/layout.html" %}
{% block content %}
<section class="p-6">
  <h1 class="text-2xl font-semibold mb-4">RAG Index</h1>
  <div class="grid gap-4 md:grid-cols-2">
    <div class="p-4 rounded border">
      <h2 class="font-medium mb-2">Ingest Document</h2>
      <div class="flex gap-2">
        <input id="rag-path" type="text" class="w-full border rounded px-2 py-1" placeholder="Path to file (pdf/txt/md/json)" />
        <button id="rag-load" class="px-3 py-1 bg-blue-600 text-white rounded">Load</button>
      </div>
      <div id="rag-load-msg" class="text-sm mt-2 text-gray-600"></div>
    </div>
    <div class="p-4 rounded border">
      <h2 class="font-medium mb-2">Query</h2>
      <div class="flex gap-2">
        <input id="rag-q" type="text" class="w-full border rounded px-2 py-1" placeholder="Ask a question" />
        <button id="rag-run" class="px-3 py-1 bg-green-600 text-white rounded">Search</button>
      </div>
      <ul id="rag-results" class="mt-3 space-y-2 text-sm"></ul>
    </div>
  </div>
  <div class="grid gap-4 md:grid-cols-2 mt-6">
    <div class="p-4 rounded border">
      <h2 class="font-medium mb-2">RAG Nodes</h2>
      <button id="rag-sync" class="px-3 py-1 bg-purple-600 text-white rounded">Sync Memory Now</button>
      <div id="rag-sync-msg" class="text-sm mt-2 text-gray-600"></div>
      <div id="rag-nodes" class="text-sm mt-2"></div>
    </div>
    <div class="p-4 rounded border">
      <h2 class="font-medium mb-2">RAG Metrics</h2>
      <pre id="rag-metrics" class="text-xs"></pre>
    </div>
  </div>
  <script>
  (function(){
    const $ = sel => document.querySelector(sel);
    $('#rag-load').addEventListener('click', async () => {
      const path = $('#rag-path').value.trim();
      if(!path){ return; }
      const r = await fetch('/rag/load', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path})});
      const j = await r.json();
      $('#rag-load-msg').textContent = r.ok ? `Loaded: ${JSON.stringify(j)}` : `Error: ${j.detail || 'failed'}`;
    });
    $('#rag-run').addEventListener('click', async () => {
      const q = $('#rag-q').value.trim();
      if(!q){ return; }
      const r = await fetch('/rag/query', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query:q, top_k:5})});
      const j = await r.json();
      const ul = $('#rag-results');
      ul.innerHTML='';
      (j.results||[]).forEach(it => {
        const li = document.createElement('li');
        li.className='p-2 rounded border';
        li.textContent = `${(it.metadata && it.metadata.source) ? it.metadata.source + ' — ' : ''}${(it.text||'').slice(0,160)}... (score=${(it.score||0).toFixed(3)})`;
        ul.appendChild(li);
      });
    });
    async function refreshNodes(){
      const r = await fetch('/dashboard/rag_nodes');
      const j = await r.json();
      const div = $('#rag-nodes');
      const nodes = (j.nodes||[]).map(n => `${n.name||''} (${n.enabled?'on':'off'}) — ${n.path||''}`).join('\n');
      div.textContent = `Vector size: ${(j.vector&&j.vector.size)||0}, last_sync: ${(j.vector&&j.vector.last_sync)||0}\n` + nodes;
    }
    async function refreshMetrics(){
      const r = await fetch('/dashboard/rag_metrics');
      const j = await r.json();
      $('#rag-metrics').textContent = JSON.stringify(j.metrics||{}, null, 2);
    }
    $('#rag-sync').addEventListener('click', async () => {
      const r = await fetch('/dashboard/rag_sync_memory', {method:'POST'});
      const j = await r.json();
      $('#rag-sync-msg').textContent = r.ok ? `Synced: ${JSON.stringify(j)}` : `Error: ${j.detail||'failed'}`;
      refreshNodes();
    });
    refreshNodes();
    refreshMetrics();
  })();
  </script>
</section>
{% endblock %}
